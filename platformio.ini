; Firmware overlay: append this section to Meshtastic firmware/platformio.ini.
; This ROS 2 repository does not contain the firmware sources or esp32_base.
[env:adaptive_agrotech_v4]
extends = esp32_base
board = esp32dev
board_level = extra
custom_meshtastic_architecture = esp32
custom_meshtastic_display_name = Adaptive AgroTech Wireless Datalogger and Smart Controller v4.0
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 3
build_flags =
  ${esp32_base.build_flags}
  -I variants/adaptive_agrotech_v4
  -D ADAPTIVE_AGROTECH_V4
upload_speed = 115200
