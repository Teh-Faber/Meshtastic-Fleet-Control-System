[develop]
script_dir=$base/lib/meshtastic_bridge
[install]
install_scripts=$base/lib/meshtastic_bridge
[tool:pytest]
# Only collect the linters in test/. The link tests in scripts/tests/ are
# hardware tests run through launch files, not unit tests.
testpaths = test
# The system pytest (6.2.5) predates pytest>=7.2's _pytest.scope module, which
# a pip-installed anyio's pytest11 entry point plugin requires. Since pytest
# autoloads every installed pytest11 plugin, that mismatch crashes collection
# entirely unless anyio's plugin is explicitly blocked here.
addopts = -p no:anyio
